  <text x="141" y="190" fill="rgba(226,232,240,0.55)" font-size="11">区分表层请求与真实目标</text>
  <!-- Steps -->
  <circle cx="150" cy="222" r="4" fill="#a78bfa" opacity="0.8"/>
  <text x="162" y="226" fill="rgba(226,232,240,0.85)" font-size="12">保留原始请求</text>
  <text x="162" y="243" fill="rgba(148,163,184,0.5)" font-size="10">原样保留用户原话，不做改写</text>

  <circle cx="150" cy="272" r="4" fill="#a78bfa" opacity="0.8"/>
  <text x="162" y="276" fill="rgba(226,232,240,0.85)" font-size="12">区分事实与推断</text>
  <text x="162" y="293" fill="rgba(148,163,184,0.5)" font-size="10">标记已陈述 vs 推断的内容</text>

  <circle cx="150" cy="322" r="4" fill="#a78bfa" opacity="0.8"/>
  <text x="162" y="326" fill="rgba(226,232,240,0.85)" font-size="12">提出关键问题</text>
  <text x="162" y="343" fill="rgba(148,163,184,0.5)" font-size="10">最多 1-3 个能改变方向的问题</text>

  <!-- Output -->
  <rect x="141" y="380" width="178" height="30" rx="5" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="0.5"/>
  <text x="230" y="399" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="500">📋 → 输出：需求基线</text>

  <!-- Decorative corner -->
  <path d="M327,90 L335,90 L335,98" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <path d="M125,462 L125,470 L133,470" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
</g>

