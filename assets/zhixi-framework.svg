<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'SF Pro Display','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="75%">
    <stop offset="0%" stop-color="#1a1040"/>
    <stop offset="100%" stop-color="#08080f"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(100,130,255,0.04)" stroke-width="0.5"/>
  </pattern>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gl2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.03"/>
  </linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#2563eb" stop-opacity="0.03"/>
  </linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0891b2" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0891b2" stop-opacity="0.03"/>
  </linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#059669" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#059669" stop-opacity="0.03"/>
  </linearGradient>
  <linearGradient id="bar1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="bar2"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="bar3"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
  <linearGradient id="bar4"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="enterG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="exitG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
</defs>

<style>
  text { user-select: none; }
  .card { transition: opacity 0.3s; }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .flow-line { animation: dash 1.5s linear infinite; }
  .dot-pulse { animation: pulse 2s ease-in-out infinite; }
</style>

<!-- Background -->
<rect width="1200" height="580" fill="url(#bg)" rx="12"/>
<rect width="1200" height="580" fill="url(#grid)" rx="12"/>

<!-- HUD corner brackets -->
<path d="M16,8 L8,8 L8,16" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5"/>
<path d="M1184,8 L1192,8 L1192,16" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5"/>
<path d="M16,572 L8,572 L8,564" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5"/>
<path d="M1184,572 L1192,572 L1192,564" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5"/>

<!-- Decorative side lines -->
<line x1="28" y1="50" x2="28" y2="530" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
<line x1="1172" y1="50" x2="1172" y2="530" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
<text x="34" y="290" fill="rgba(139,92,246,0.12)" font-size="9" font-family="monospace" writing-mode="tb">ZHIXI-FRAMEWORK-v1.0.1</text>
<text x="1166" y="180" fill="rgba(139,92,246,0.12)" font-size="9" font-family="monospace" writing-mode="tb">FOUR-STAGE-PIPELINE</text>

<!-- Title -->
<text x="600" y="42" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="3">知 悉 · 四 阶 段 思 维 框 架</text>
<text x="600" y="64" text-anchor="middle" fill="rgba(148,163,184,0.6)" font-size="11" font-family="monospace" letter-spacing="4">ZHIXI FOUR-STAGE THINKING FRAMEWORK</text>
<line x1="400" y1="74" x2="800" y2="74" stroke="rgba(139,92,246,0.15)" stroke-width="0.5"/>

<!-- ═══ Entry Node ═══ -->
<g filter="url(#gl)">
  <rect x="40" y="255" width="62" height="50" rx="25" fill="url(#enterG)" opacity="0.9"/>
</g>
<text x="71" y="275" text-anchor="middle" fill="#fff" font-size="16">💭</text>
<text x="71" y="295" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="10" font-weight="600">模糊想法</text>

<!-- ═══ Flow Lines ═══ -->
<!-- Entry → S1 -->
<line x1="102" y1="280" x2="120" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" class="flow-line" opacity="0.7"/>

<!-- S1 → S2 -->
<line x1="340" y1="280" x2="365" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" class="flow-line" opacity="0.7"/>
<circle cx="352" cy="280" r="3" fill="#a78bfa" class="dot-pulse"/>
<rect x="320" y="254" width="66" height="16" rx="3" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="0.5"/>
