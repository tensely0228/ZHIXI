<!-- S4 → Exit -->
<line x1="1060" y1="280" x2="1088" y2="280" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" class="flow-line" opacity="0.7"/>

<!-- ═══ Stage 1: 知己 ═══ -->
<g class="card">
  <rect x="125" y="90" width="210" height="380" rx="8" fill="url(#g1)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="125" y="90" width="210" height="5" rx="2.5" fill="url(#bar1)"/>
  <!-- Stage badge -->
  <circle cx="155" cy="125" r="14" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="155" y="130" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">1</text>
  <!-- Title -->
