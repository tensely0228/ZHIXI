<rect x="560" y="254" width="66" height="16" rx="3" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="0.5"/>
<text x="593" y="265" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="500">能力清单</text>

<!-- S3 → S4 -->
<line x1="820" y1="280" x2="845" y2="280" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4" class="flow-line" opacity="0.7"/>
